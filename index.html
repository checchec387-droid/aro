<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Road Engineering Expert</title>
<style>
:root{--navy:#10243a;--navy2:#183550;--blue:#2878d0;--cyan:#20b8b0;--bg:#f3f6fa;--card:#fff;--ink:#172b43;--muted:#718096;--line:#e4eaf1;--green:#15966b;--amber:#d58b19;--red:#cf4b4b;--shadow:0 8px 28px rgba(20,42,67,.07)}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}button,input,select,textarea{font:inherit}button{cursor:pointer}
.shell{display:grid;grid-template-columns:252px 1fr;min-height:100vh}.sidebar{background:linear-gradient(180deg,var(--navy),#0c1b2d);color:#dbe6f1;padding:22px 14px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:4px 10px 18px;border-bottom:1px solid #ffffff1b}.brandmark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2b82dc,#22b7ad);display:grid;place-items:center;font-weight:800;color:white;font-size:18px}.brand strong{display:block;font-size:14px;letter-spacing:.2px}.brand small{color:#8fa8bf;font-size:10px;letter-spacing:1.2px;text-transform:uppercase}.navlabel{font-size:10px;letter-spacing:1.3px;color:#7f9ab4;padding:0 12px;margin:4px 0}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#b9c9d8;text-align:left;padding:10px 12px;border-radius:9px;display:flex;gap:12px;align-items:center;font-weight:550}.nav button:hover,.nav button.active{background:#ffffff13;color:#fff}.nav button.active{box-shadow:inset 3px 0 #35b9b0}.ico{width:19px;text-align:center;font-size:16px}.sidefoot{margin-top:auto;border-top:1px solid #ffffff1b;padding:15px 10px;color:#90a7bd;font-size:11px}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;z-index:5}.crumb{color:var(--muted);font-size:12px}.crumb b{color:var(--ink);font-size:13px}.topright{display:flex;align-items:center;gap:15px}.projectpill{background:#f2f6fa;border:1px solid var(--line);padding:8px 12px;border-radius:8px;color:#50647a;font-size:12px}.avatar{width:34px;height:34px;border-radius:50%;background:#e1f1f0;color:#147c78;display:grid;place-items:center;font-weight:700}.content{padding:30px 34px;max-width:1500px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:24px}.eyebrow{color:var(--blue);font-weight:700;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}.pagehead h1{margin:4px 0 5px;font-size:26px;letter-spacing:-.6px}.sub{color:var(--muted);margin:0;max-width:720px}.actions{display:flex;gap:9px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:white;color:#42566d;border-radius:8px;padding:9px 13px;font-weight:650;font-size:12px}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.dark{background:var(--navy);border-color:var(--navy);color:white}.btn:hover{filter:brightness(.97);transform:translateY(-1px)}.grid{display:grid;gap:16px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:18px}.stat,.panel,.modulecard{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow)}.stat{padding:18px 19px}.stathead{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;font-weight:650}.statnum{font-size:27px;font-weight:750;margin:8px 0 1px;letter-spacing:-.7px}.statnote{font-size:11px;color:var(--muted)}.staticon{width:32px;height:32px;border-radius:9px;background:#edf4fc;color:var(--blue);display:grid;place-items:center}.cols{grid-template-columns:1.45fr 1fr}.panel{padding:20px;margin-bottom:16px}.panelhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}.panelhead h3{margin:0;font-size:14px}.panelhead span{font-size:11px;color:var(--muted)}.activity{display:grid;gap:0}.activityrow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid #edf1f5}.activityrow:first-child{border-top:0}.dot{width:9px;height:9px;border-radius:50%;background:var(--cyan);box-shadow:0 0 0 4px #e6f7f5}.activityrow b{font-size:12px;display:block}.activityrow small{color:var(--muted);font-size:11px}.activityrow time{margin-left:auto;color:var(--muted);font-size:10px}.progress{height:7px;background:#edf1f5;border-radius:8px;overflow:hidden}.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--cyan));border-radius:8px}.tag{display:inline-flex;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:700;background:#edf5ff;color:#286bb0}.tag.green{background:#e8f7f1;color:#16815f}.tag.amber{background:#fff5e4;color:#a76c0c}.tag.red{background:#fff0f0;color:#b84141}.modules{grid-template-columns:repeat(3,minmax(0,1fr))}.modulecard{padding:17px;cursor:pointer;transition:.15s}.modulecard:hover{transform:translateY(-2px);border-color:#b9d2ec}.moduleicon{width:38px;height:38px;border-radius:11px;background:#edf5ff;color:#2675c8;display:grid;place-items:center;font-size:18px;margin-bottom:12px}.modulecard h3{margin:0 0 5px;font-size:13px}.modulecard p{margin:0;color:var(--muted);font-size:11px;min-height:34px}.modulecard small{display:block;margin-top:13px;color:#2675c8;font-weight:700;font-size:10px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:5px}.field label{font-size:11px;font-weight:700;color:#53677c}.field input,.field select,.field textarea{width:100%;border:1px solid #dce4ed;border-radius:8px;padding:10px 11px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#76a9df;box-shadow:0 0 0 3px #eaf3fc}.field textarea{min-height:82px;resize:vertical}.full{grid-column:1/-1}.resultbox{background:#f4f8fc;border:1px solid #dfeaf5;border-radius:11px;padding:17px;margin-top:16px}.resultbig{font-size:24px;font-weight:800;color:#1e6db5}.resultbox p{margin:4px 0;color:var(--muted);font-size:11px}.formula{font-family:ui-monospace,monospace;background:#fff;border:1px solid var(--line);padding:9px 11px;border-radius:7px;margin-top:10px;color:#3f5871;font-size:12px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:10px}table{width:100%;border-collapse:collapse;min-width:650px}th,td{text-align:left;padding:12px 13px;border-bottom:1px solid #edf1f5;font-size:11px}th{background:#f7f9fc;color:#66798d;font-size:10px;text-transform:uppercase;letter-spacing:.5px}tr:last-child td{border-bottom:0}.empty{padding:30px;text-align:center;color:var(--muted);font-size:12px}.notice{padding:12px 14px;border-radius:9px;background:#fff8e9;border:1px solid #f2dfb9;color:#8b641e;font-size:11px;margin-bottom:15px}.notice.blue{background:#eff6ff;border-color:#d5e6fb;color:#38658e}.notice.green{background:#eef9f4;border-color:#d0ecde;color:#287553}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:15px}.search{border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:220px}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.rule{padding:13px;border:1px solid var(--line);border-radius:9px;margin:8px 0}.rule b{font-size:12px}.rule small{display:block;color:var(--muted);margin-top:3px}.hidden{display:none!important}.fileinput{display:none}.toast{position:fixed;right:24px;bottom:24px;background:#122a43;color:white;padding:12px 16px;border-radius:9px;box-shadow:var(--shadow);z-index:20;font-size:12px}.footerhint{color:var(--muted);font-size:10px;margin-top:15px}
@media(max-width:1000px){.shell{grid-template-columns:205px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.cols{grid-template-columns:1fr}.modules{grid-template-columns:repeat(2,1fr)}.content{padding:24px}}
@media(max-width:700px){.shell{grid-template-columns:1fr}.sidebar{position:relative;padding:12px;gap:12px}.brand{padding-bottom:10px}.nav{grid-template-columns:repeat(3,1fr)}.navlabel,.sidefoot{display:none}.nav button{font-size:10px;padding:8px;justify-content:center;flex-direction:column;gap:2px}.topbar{padding:0 15px;height:58px}.content{padding:20px 14px}.pagehead{display:block}.actions{margin-top:14px}.stats{gap:9px}.stat{padding:13px}.statnum{font-size:22px}.modules{grid-template-columns:1fr 1fr}.formgrid,.split{grid-template-columns:1fr}.pagehead h1{font-size:22px}}
@media print{.sidebar,.topbar,.actions,.btn,.nav{display:none!important}.shell{display:block}.content{padding:0;max-width:none}.panel,.stat{box-shadow:none;break-inside:avoid}}
</style>
</head>
<body>
<div class="shell">
<aside class="sidebar">
 <div class="brand"><div class="brandmark">RE</div><div><strong>ROAD ENGINEERING</strong><small>EXPERT PLATFORM</small></div></div>
 <div><div class="navlabel">ESPACE DE TRAVAIL</div><nav class="nav" id="nav">
 <button class="active" data-page="dashboard"><span class="ico">▦</span>Tableau de bord</button>
 <button data-page="projects"><span class="ico">▤</span>Mes projets</button>
 <button data-page="calculations"><span class="ico">∑</span>Calculs</button>
 <button data-page="compliance"><span class="ico">✓</span>Conformité</button>
 </nav></div>
 <div><div class="navlabel">INGÉNIERIE</div><nav class="nav">
 <button data-page="geometry"><span class="ico">⌁</span>Géométrie routière</button>
 <button data-page="visuals"><span class="ico">▱</span>Visualisations</button>
 <button data-page="reports"><span class="ico">▧</span>Rapports</button>
 </nav></div>
 <div><div class="navlabel">RESSOURCES</div><nav class="nav">
 <button data-page="standards"><span class="ico">▣</span>Référentiels</button>
 <button data-page="history"><span class="ico">◷</span>Historique</button>
 <button data-page="settings"><span class="ico">⚙</span>Paramètres</button>
 </nav></div>
 <div class="sidefoot">ROAD ENGINEERING EXPERT<br>Version prototype 1.0 · Français</div>
</aside>
<main class="main">
<header class="topbar"><div class="crumb">Workspace <span style="color:#b9c5d1">/</span> <b id="crumb">Tableau de bord</b></div><div class="topright"><div class="projectpill" id="currentProject">Projet : Aucun projet actif</div><div class="avatar">RE</div></div></header>
<div class="content" id="view"></div>
</main>
</div>
<div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const store={
 get(k,d){try{return JSON.parse(localStorage.getItem('re_'+k))??d}catch{return d}},
 set(k,v){localStorage.setItem('re_'+k,JSON.stringify(v))}
};
let projects=store.get('projects',[]), standards=store.get('standards',[
 {id:'arp',name:'ARP — Aménagement des Routes Principales',version:'À renseigner',status:'À documenter',kind:'Norme',notes:'Référentiel à importer et valider.'},
 {id:'ictaal',name:'ICTAAL — Autoroutes de liaison',version:'À renseigner',status:'À documenter',kind:'Instruction',notes:'Référentiel à importer et valider.'}
]), checks=store.get('checks',[]), history=store.get('history',[]), activeProject=store.get('activeProject',null), files=store.get('files',[]);
let page='dashboard', lastResult=null;
function save(){store.set('projects',projects);store.set('standards',standards);store.set('checks',checks);store.set('history',history);store.set('activeProject',activeProject);store.set('files',files)}
function toast(t){let e=$('#toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2600)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function go(p){page=p;$$('#nav button,[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}
document.addEventListener('click',e=>{let b=e.target.closest('[data-page]');if(b)go(b.dataset.page)});
function head(k,t,d,actions=''){return `<div class="pagehead"><div><div class="eyebrow">${k}</div><h1>${t}</h1><p class="sub">${d}</p></div><div class="actions">${actions}</div></div>`}
function panel(t,sub,body){return `<section class="panel"><div class="panelhead"><h3>${t}</h3><span>${sub||''}</span></div>${body}</section>`}
function projectName(){return projects.find(p=>p.id===activeProject)?.name||'Aucun projet actif'}
function render(){ $('#crumb').textContent=({dashboard:'Tableau de bord',projects:'Mes projets',calculations:'Calculs',compliance:'Conformité',geometry:'Géométrie routière',visuals:'Visualisations',reports:'Rapports',standards:'Référentiels',history:'Historique',settings:'Paramètres'})[page];$('#currentProject').textContent='Projet : '+projectName();let v=$('#view');v.innerHTML=({dashboard:dashboard,projects:projectsPage,calculations:calculationsPage,compliance:compliancePage,geometry:geometryPage,visuals:visualsPage,reports:reportsPage,standards:standardsPage,history:historyPage,settings:settingsPage})[page]();bindPage()}
function dashboard(){let n=projects.length, nchecks=checks.length, valid=checks.filter(c=>c.status==='Conforme').length;return head('VUE D’ENSEMBLE','Ingénierie routière, avec méthode.','Votre environnement de conception, de calcul et de vérification réglementaire.','<button class="btn primary" data-action="new-project">＋ Nouveau projet</button>')+
`<div class="grid stats"><div class="stat"><div class="stathead">Projets enregistrés <span class="staticon">▤</span></div><div class="statnum">${n}</div><div class="statnote">Dans votre espace local</div></div><div class="stat"><div class="stathead">Référentiels <span class="staticon">▣</span></div><div class="statnum">${standards.length}</div><div class="statnote">ARP, ICTAAL et extensions</div></div><div class="stat"><div class="stathead">Contrôles configurés <span class="staticon">✓</span></div><div class="statnum">${nchecks}</div><div class="statnote">Règles enregistrées</div></div><div class="stat"><div class="stathead">Calculs historisés <span class="staticon">∑</span></div><div class="statnum">${history.length}</div><div class="statnote">Résultats conservés</div></div></div>
<div class="grid cols">${panel('Accès rapide','Modules techniques',`<div class="grid modules">
${[['∑','Calculs géométriques','Clothoïde, dévers et interpolation','calculations'],['✓','Contrôle de conformité','Règles et seuils validés','compliance'],['▣','Référentiels','Documents, versions et articles','standards'],['⌁','Géométrie routière','Paramètres et éléments de tracé','geometry'],['▧','Rapports','Synthèse et impression','reports'],['◷','Historique','Traçabilité des opérations','history']].map(x=>`<div class="modulecard" data-page="${x[3]}"><div class="moduleicon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><small>OUVRIR LE MODULE →</small></div>`).join('')}</div>`)}
${panel('Activité récente','Dernières opérations',history.length?`<div class="activity">${history.slice(-5).reverse().map(h=>`<div class="activityrow"><div class="dot"></div><div><b>${esc(h.title)}</b><small>${esc(h.detail)}</small></div><time>${esc(h.date)}</time></div>`).join('')}</div>`:`<div class="empty">Aucune opération pour le moment.<br>Vos calculs et modifications apparaîtront ici.</div>`)}
</div><div class="notice blue" style="margin-top:0"><b>Cadre de fiabilité :</b> les calculs géométriques génériques sont distincts des prescriptions réglementaires. Aucun seuil ARP/ICTAAL n'est présumé validé dans cette version. Importez les documents puis validez chaque règle avant de l'utiliser comme critère de conformité.</div>`}
function projectsPage(){return head('GESTION DE PROJET','Mes projets','Créez un dossier d’étude et centralisez ses paramètres techniques.','<button class="btn primary" data-action="new-project">＋ Créer un projet</button>')+`<div class="panel"><div class="panelhead"><h3>Portefeuille de projets</h3><span>${projects.length} projet(s)</span></div>${projects.length?`<div class="tablewrap"><table><thead><tr><th>Projet</th><th>Infrastructure</th><th>Référentiel</th><th>Vitesse de référence</th><th>Statut</th><th>Action</th></tr></thead><tbody>${projects.map(p=>`<tr><td><b>${esc(p.name)}</b><br><small>${esc(p.client||'Maître d’ouvrage non renseigné')}</small></td><td>${esc(p.type)}</td><td>${esc(p.standard||'Non défini')}</td><td>${p.speed?esc(p.speed)+' km/h':'—'}</td><td><span class="tag ${p.id===activeProject?'green':''}">${p.id===activeProject?'Actif':'En étude'}</span></td><td><button class="btn" data-action="activate" data-id="${p.id}">Ouvrir</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Aucun projet créé. Commencez par créer votre premier dossier d'étude.</div>`}</div>`}
function calculationsPage(){return head('OUTILS DE CALCUL','Calculs géométriques','Calculs numériques transparents. Les résultats géométriques ne constituent pas à eux seuls une validation réglementaire.')+
`<div class="grid cols"><div>${panel('Clothoïde','Géométrie de raccordement',`<div class="formgrid"><div class="field"><label>Rayon circulaire R (m)</label><input id="clR" type="number" min="0.001" value="500"></div><div class="field"><label>Longueur de clothoïde L (m)</label><input id="clL" type="number" min="0.001" value="80"></div></div><button class="btn primary" style="margin-top:14px" data-action="calc-clothoid">Calculer</button><div id="clResult"></div>`)}
${panel('Variation linéaire du dévers','Interpolation entre deux sections',`<div class="formgrid"><div class="field"><label>Dévers initial (%)</label><input id="d1" type="number" step=".01" value="2.5"></div><div class="field"><label>Dévers final (%)</label><input id="d2" type="number" step=".01" value="5"></div><div class="field"><label>Distance de transition (m)</label><input id="dl" type="number" min=".001" value="60"></div><div class="field"><label>Abscisse depuis le début (m)</label><input id="dx" type="number" min="0" value="30"></div></div><button class="btn primary" style="margin-top:14px" data-action="calc-slope">Calculer</button><div id="slopeResult"></div>`)}
</div><div>${panel('Outils disponibles','Catalogue',`<div class="rule"><b>Rayon / longueur de clothoïde</b><small>Paramètre A = √(R × L), relation géométrique usuelle.</small></div><div class="rule"><b>Interpolation du dévers</b><small>Variation linéaire entre deux valeurs et une distance définie.</small></div><div class="rule"><b>Calculs complémentaires</b><small>Profil en long, profil en travers, giration et visibilité : modules à compléter après intégration des règles sources.</small></div>`)}
<div class="notice">Les formules ci-dessus sont des outils géométriques génériques. Elles ne déterminent pas la longueur réglementaire minimale d'une clothoïde ni le dévers admissible : ces vérifications dépendent du référentiel, de son édition et de ses conditions d'application.</div></div></div>`}
function compliancePage(){return head('ASSURANCE QUALITÉ','Contrôle de conformité','Configurez des critères à partir d’articles normatifs vérifiés. Les règles non validées ne doivent pas être utilisées.')+
`<div class="notice blue">Pour activer un contrôle réglementaire, renseignez la limite, l’unité et la référence précise (article, tableau et page), puis cochez « règle vérifiée ». Cette application ne préremplit aucun seuil ARP ou ICTAAL non confirmé.</div><div class="panel"><div class="panelhead"><h3>Ajouter un critère de contrôle</h3><span>Règle documentée</span></div><div class="formgrid"><div class="field"><label>Nom du paramètre</label><input id="ckName" placeholder="Ex. Rayon minimal en plan"></div><div class="field"><label>Référentiel</label><select id="ckStd">${standards.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Valeur limite</label><input id="ckLimit" type="number" placeholder="Valeur numérique"></div><div class="field"><label>Unité</label><input id="ckUnit" placeholder="m, %, km/h…"></div><div class="field full"><label>Référence exacte (article, tableau, page, édition)</label><input id="ckRef" placeholder="Ex. Article…, tableau…, page…"></div><div class="field full"><label>Condition / notes d’application</label><textarea id="ckNote" placeholder="Catégorie de route, vitesse, relief, exception…"></textarea></div><label class="full" style="font-size:11px"><input type="checkbox" id="ckVerified"> J’ai vérifié cette prescription dans le document officiel.</label></div><button class="btn primary" style="margin-top:14px" data-action="add-check">Enregistrer le critère</button></div>
<div class="panel"><div class="panelhead"><h3>Critères enregistrés</h3><span>${checks.length} critère(s)</span></div>${checks.length?`<div class="tablewrap"><table><thead><tr><th>Paramètre</th><th>Référentiel</th><th>Limite</th><th>Référence</th><th>Validation</th><th></th></tr></thead><tbody>${checks.map(c=>`<tr><td><b>${esc(c.name)}</b><br><small>${esc(c.note||'')}</small></td><td>${esc(c.std)}</td><td>${esc(c.limit)} ${esc(c.unit)}</td><td>${esc(c.ref)}</td><td><span class="tag ${c.verified?'green':'amber'}">${c.verified?'Vérifiée':'À vérifier'}</span></td><td><button class="btn" data-action="del-check" data-id="${c.id}">Supprimer</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">Aucun critère. Ajoutez une prescription documentée pour commencer.</div>`}</div>`}
function geometryPage(){return head('CONCEPTION','Géométrie routière','Espace de préparation des données de tracé et de profils. Les contrôles normatifs sont liés aux critères validés.')+
`<div class="grid modules">${[['⌁','Tracé en plan','Alignements, courbes circulaires, raccordements'],['∿','Profil en long','Déclivités et raccordements verticaux'],['▱','Profil en travers','Voies, accotements, plateforme et pentes'],['↗','Dévers','Basculement et variation transversale'],['⤴','Carrefours','Géométrie et visibilité'],['⇄','Échangeurs','Bretelles, insertion et décélération']].map(x=>`<div class="modulecard"><div class="moduleicon">${x[0]}</div><h3>${x[1]}</h3><p>${x[2]}</p><small>ESPACE PRÉVU — RÈGLES À INTÉGRER</small></div>`).join('')}</div><div class="notice" style="margin-top:16px">Ces espaces constituent la structure fonctionnelle de la plateforme. Les algorithmes métier détaillés seront activés après validation des prescriptions et spécifications de chaque module.</div>`}
function visualsPage(){return head('REPRÉSENTATION','Visualisations techniques','Prévisualisez les relations géométriques de base et préparez les vues de projet.')+
`<div class="grid cols"><div>${panel('Schéma de transition du dévers','Illustration conceptuelle',`<svg viewBox="0 0 620 210" width="100%" role="img"><path d="M35 35 L585 35 M35 175 L585 175" stroke="#d9e2ec" stroke-width="1" stroke-dasharray="5 5"/><path d="M45 145 L575 55" stroke="#2878d0" stroke-width="4" fill="none"/><path d="M45 145 L575 145" stroke="#9aabba" stroke-width="2" fill="none"/><path d="M45 155 L45 130 M575 65 L575 40" stroke="#20b8b0" stroke-width="2"/><text x="45" y="195" font-size="11" fill="#718096">Début de transition</text><text x="470" y="195" font-size="11" fill="#718096">Fin de transition</text><text x="275" y="25" font-size="12" fill="#2878d0">Variation linéaire illustrative</text></svg><div class="footerhint">Schéma pédagogique non à l’échelle — ne constitue pas un plan d’exécution.</div>`)}
</div><div>${panel('Données du projet','État actuel',`<div class="rule"><b>Projet actif</b><small>${esc(projectName())}</small></div><div class="rule"><b>Critères de conformité validés</b><small>${checks.filter(c=>c.verified).length} sur ${checks.length}</small></div><div class="rule"><b>Référentiels</b><small>${standards.length} référentiel(s) enregistré(s)</small></div>`)}</div></div>`}
function reportsPage(){return head('LIVRABLES','Rapports techniques','Préparez une synthèse de votre espace de travail et imprimez-la en PDF depuis votre navigateur.','<button class="btn primary" data-action="print">⇩ Exporter / Imprimer PDF</button>')+
`<div class="panel" id="report"><div class="eyebrow">ROAD ENGINEERING EXPERT</div><h2 style="margin:5px 0 2px">Synthèse technique du projet</h2><p class="sub">Généré le ${new Date().toLocaleDateString('fr-FR')}</p><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>1. Informations générales</h3><p><b>Projet :</b> ${esc(projectName())}</p><p><b>Nombre de projets :</b> ${projects.length}</p><h3>2. Référentiels disponibles</h3>${standards.map(s=>`<p>• ${esc(s.name)} — ${esc(s.status)} — Version : ${esc(s.version)}</p>`).join('')}<h3>3. Critères de conformité documentés</h3><p>${checks.length} critère(s), dont ${checks.filter(c=>c.verified).length} vérifié(s).</p>${checks.map(c=>`<p>• ${esc(c.name)} : ${esc(c.limit)} ${esc(c.unit)} — ${esc(c.ref)} — ${c.verified?'Vérifié':'À vérifier'}</p>`).join('')}<h3>4. Historique des calculs et opérations</h3><p>${history.length} opération(s) historisée(s).</p><div class="notice">Ce document est une synthèse de travail. Il ne constitue pas une note de calcul réglementaire validée ni un visa d’ingénierie.</div></div>`}
function standardsPage(){return head('BASE DOCUMENTAIRE','Référentiels & normes','Ajoutez des documents, gérez leurs éditions et tracez les prescriptions utilisées dans les études.','<label class="btn primary" for="stdUpload">＋ Importer un document</label><input class="fileinput" id="stdUpload" type="file" accept=".pdf,.doc,.docx,.txt" multiple>')+
`<div class="notice blue">L’importation enregistre les documents dans cette session locale. L’extraction automatique des tableaux, formules et articles ainsi que la validation experte constituent une étape distincte. Ne marquez pas une règle comme validée sans vérification du document source.</div><div class="grid cols"><div>${panel('Référentiels enregistrés','Bibliothèque',standards.map(s=>`<div class="rule"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(s.name)}</b><span class="tag amber">${esc(s.status)}</span></div><small>Type : ${esc(s.kind)} · Édition : ${esc(s.version)}</small><small>${esc(s.notes||'')}</small></div>`).join('')+`<button class="btn" data-action="add-standard">＋ Ajouter un référentiel manuellement</button>`)}
</div><div>${panel('Documents importés','Fichiers de référence',files.length?files.map(f=>`<div class="rule"><b>${esc(f.name)}</b><small>${esc(f.size)} · Importé le ${esc(f.date)}</small><span class="tag amber">Extraction / validation requise</span></div>`).join(''):`<div class="empty">Aucun document importé.</div>`)}
${panel('Cycle de validation','Workflow documentaire',`<div class="rule"><b>01 — Importer</b><small>Charger le document officiel et renseigner son édition.</small></div><div class="rule"><b>02 — Extraire</b><small>Identifier articles, tableaux, formules, conditions et pages.</small></div><div class="rule"><b>03 — Vérifier</b><small>Comparer chaque extraction à la source officielle.</small></div><div class="rule"><b>04 — Publier</b><small>Activer les règles testées et validées pour les contrôles.</small></div>`)}</div></div>`}
function historyPage(){return head('TRAÇABILITÉ','Historique','Retrouvez les calculs et opérations enregistrés dans cette application.','<button class="btn" data-action="clear-history">Effacer l’historique</button>')+`<div class="panel"><div class="panelhead"><h3>Journal des opérations</h3><span>${history.length} entrée(s)</span></div>${history.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Opération</th><th>Détail</th></tr></thead><tbody>${history.slice().reverse().map(h=>`<tr><td>${esc(h.date)}</td><td><b>${esc(h.title)}</b></td><td>${esc(h.detail)}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">L’historique est vide.</div>`}</div>`}
function settingsPage(){return head('CONFIGURATION','Paramètres','Préférences locales et gestion des données de démonstration.')+`<div class="grid cols"><div>${panel('Espace de travail','Données locales',`<p class="sub">Les données de cette version sont enregistrées dans le stockage local du navigateur utilisé. Elles ne sont pas synchronisées entre plusieurs appareils.</p><button class="btn" data-action="export-data">Exporter mes données JSON</button> <label class="btn" for="jsonImport">Importer JSON</label><input class="fileinput" type="file" id="jsonImport" accept=".json">`)}
</div><div>${panel('À propos','Version',`<p><b>Road Engineering Expert</b></p><p class="sub">Prototype autonome — version 1.0</p><p class="sub">Architecture initiale orientée multi-référentiels. Aucun seuil réglementaire n’est intégré sans validation documentaire.</p>`)}</div></div>`}
function log(title,detail){history.push({title,detail,date:new Date().toLocaleString('fr-FR')});save()}
function bindPage(){
 $$('[data-action]').forEach(b=>b.addEventListener('click',()=>action(b.dataset.action,b.dataset.id)));
 let up=$('#stdUpload');if(up)up.addEventListener('change',e=>{[...e.target.files].forEach(f=>files.push({name:f.name,size:(f.size/1024).toFixed(1)+' Ko',date:new Date().toLocaleDateString('fr-FR')}));save();log('Import documentaire',e.target.files.length+' fichier(s) ajouté(s) à la bibliothèque');render();toast('Document(s) ajouté(s) à la bibliothèque locale.')});
 let ji=$('#jsonImport');if(ji)ji.addEventListener('change',async e=>{try{let d=JSON.parse(await e.target.files[0].text());projects=d.projects||projects;standards=d.standards||standards;checks=d.checks||checks;history=d.history||history;files=d.files||files;activeProject=d.activeProject||activeProject;save();render();toast('Données importées.')}catch{toast('Fichier JSON invalide.')}});
}
function action(a,id){
 if(a==='new-project'){let name=prompt('Nom du projet :');if(!name)return;let p={id:crypto.randomUUID(),name,type:prompt('Type d’infrastructure (route, autoroute…) :')||'Route',standard:'Non défini',speed:'',client:''};projects.push(p);activeProject=p.id;save();log('Création de projet',name);go('projects')}
 if(a==='activate'){activeProject=id;save();render();toast('Projet actif mis à jour.')}
 if(a==='calc-clothoid'){let R=+$('#clR').value,L=+$('#clL').value;if(!(R>0&&L>0)){toast('Saisissez des valeurs positives.');return}let A=Math.sqrt(R*L),theta=L/(2*R),deg=theta*180/Math.PI;$('#clResult').innerHTML=`<div class="resultbox"><div class="eyebrow">RÉSULTAT GÉOMÉTRIQUE</div><div class="resultbig">A = ${A.toFixed(3)} m</div><p>Angle de déflexion approximatif θ = ${deg.toFixed(4)}°</p><div class="formula">A = √(R × L) = √(${R} × ${L})</div></div>`;log('Calcul clothoïde',`R=${R} m ; L=${L} m ; A=${A.toFixed(3)} m`);save()}
 if(a==='calc-slope'){let d1=+$('#d1').value,d2=+$('#d2').value,L=+$('#dl').value,x=+$('#dx').value;if(!(L>0)||x<0||x>L){toast('La distance doit être positive et l’abscisse comprise entre 0 et L.');return}let d=d1+(d2-d1)*x/L;$('#slopeResult').innerHTML=`<div class="resultbox"><div class="eyebrow">RÉSULTAT D’INTERPOLATION</div><div class="resultbig">${d.toFixed(3)} %</div><p>Dévers interpolé à x = ${x} m sur L = ${L} m</p><div class="formula">d(x) = d₁ + (d₂ − d₁) × x / L</div></div>`;log('Interpolation du dévers',`d=${d.toFixed(3)} % à x=${x} m`);save()}
 if(a==='add-check'){let name=$('#ckName').value,limit=$('#ckLimit').value,ref=$('#ckRef').value;if(!name||limit===''||!ref){toast('Nom, limite et référence sont obligatoires.');return}checks.push({id:crypto.randomUUID(),name,std:$('#ckStd').value,limit,unit:$('#ckUnit').value,ref,note:$('#ckNote').value,verified:$('#ckVerified').checked});save();log('Ajout d’un critère',name);render();toast('Critère enregistré.')}
 if(a==='del-check'){checks=checks.filter(c=>c.id!==id);save();render()}
 if(a==='add-standard'){let name=prompt('Nom complet du référentiel :');if(!name)return;standards.push({id:crypto.randomUUID(),name,version:'À renseigner',status:'À documenter',kind:'Référentiel',notes:'Ajout manuel'});save();log('Ajout référentiel',name);render()}
 if(a==='print')window.print();
 if(a==='clear-history'){if(confirm('Effacer tout l’historique ?')){history=[];save();render()}}
 if(a==='export-data'){let blob=new Blob([JSON.stringify({projects,standards,checks,history,files,activeProject},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='road-engineering-data.json';a.click();URL.revokeObjectURL(url)}
}
render();
</script>
</body></html>
